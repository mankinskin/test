[package]
name = "test-cli"
version = "0.1.0"
edition = "2024"
description = "CLI interface for test-api: the `test` command (validation evidence store)"

[[bin]]
name = "test"
path = "src/bin/test.rs"

[lib]
name = "test_cli"
path = "src/lib.rs"

[dependencies]
test-api = { path = "../test-api" }
log-api = { git = "https://github.com/mankinskin/log", branch = "main" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
spec-api = { git = "https://github.com/mankinskin/spec", branch = "main" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toon-format = "0.5"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
